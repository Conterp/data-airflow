# version: "3.8"  # (opcional) Compose moderno ignora isso

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  restart: unless-stopped
  env_file:
    - ../.env
  environment:
    # Core
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    # ============================
    # 📌 Remote logging -> S3
    # ============================
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: ${AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER}
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: ${AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID}
    AIRFLOW__LOGGING__ENCRYPT_S3_LOGS: ${AIRFLOW__LOGGING__ENCRYPT_S3_LOGS:-"False"}

  # ✅ volumes apontando pra raiz do repo, não pra /docker/*
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ==========================================================
  # 🗄️ POSTGRES TEMPORÁRIO (REMOVER QUANDO ENTRAR O RDS)
  # ==========================================================
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # não expor porta em prod, a menos que você precise acessar de fora
    # ports:
    #   - "5432:5432"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - postgres

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    depends_on:
      - postgres
    command:
      - -c
      - |
          airflow db migrate

          airflow users create \
            --role Admin \
            --username "${AIRFLOW_ADMIN_USERNAME}" \
            --password "${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
            --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
            --email "${AIRFLOW_ADMIN_EMAIL}" || true

          # cria/garante a conexão AWS do remote logging (usa IAM Role da EC2)
          airflow connections add "${AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID}" \
            --conn-uri "aws://@/?region_name=${AWS_REGION}" || true

volumes:
  # volume do Postgres (REMOVER quando entrar RDS)
  postgres_data:
