# version: "3.8"  # (opcional) Compose moderno ignora isso

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  restart: unless-stopped
  env_file:
    - ../.env
  environment:
    # Core
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    # ============================
    # 📌 Remote logging -> S3
    # ============================
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: ${AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER}
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: ${AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID}
    AIRFLOW__LOGGING__ENCRYPT_S3_LOGS: ${AIRFLOW__LOGGING__ENCRYPT_S3_LOGS:-"False"}

  # ✅ volumes apontando pra raiz do repo, não pra /docker/*
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

services:
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
          airflow db migrate

          airflow users create \
            --role Admin \
            --username "${AIRFLOW_ADMIN_USERNAME}" \
            --password "${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
            --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
            --email "${AIRFLOW_ADMIN_EMAIL}" || true

          # cria/garante a conexão AWS do remote logging (usa IAM Role da EC2)
          airflow connections add "${AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID}" \
            --conn-uri "aws://@/?region_name=${AWS_REGION}" || true
